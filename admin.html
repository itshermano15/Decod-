<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decodó Admin</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="logo" href="index.html">Decodó</a><a href="index.html">Tienda →</a></header><main class="admin"><section id="login"><p>DECODÓ / ADMIN</p><h1>Acceso privado</h1><form id="loginForm" class="panel"><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button class="cta">Entrar</button><p id="loginError"></p></form></section><section id="dashboard" hidden><div class="toolbar"><h1>Catálogo</h1><button id="logout" class="danger">Cerrar sesión</button></div><div class="stats"><div>PRODUCTOS<b id="sProducts">0</b></div><div>STOCK<b id="sStock">0</b></div><div>VALOR STOCK<b id="sValue">0 €</b></div></div><form id="productForm" class="panel"><h2 id="formTitle">Nuevo producto</h2><div class="formgrid"><label>Nombre<input id="name" required></label><label>Precio (€)<input id="price" type="number" step=".01" min="0" required></label><label>Categoría<input id="category" required></label><label>Stock<input id="stock" type="number" min="0" required></label></div><label>Descripción<textarea id="description" rows="4"></textarea></label><label>Imagen<input id="imageFile" type="file" accept="image/*"></label><label>URL de imagen (opcional)<input id="imageUrl" type="url"></label><label><input id="active" type="checkbox" checked> Visible en tienda</label><button id="saveBtn" class="cta">Publicar producto</button><button id="cancelEdit" type="button" class="secondary" hidden>Cancelar</button><p id="formMessage"></p></form><h2>Productos</h2><div id="list"></div></section></main><script type="module" src="admin.js"></script></body></html>
